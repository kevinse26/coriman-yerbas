<style>
:root{
  --hoja:#3D5A2A; --hoja-osc:#2C421E; --hoja-suave:#DCE5D2; --kraft:#D8C59A; --kraft-osc:#B9A06B;
  --fondo:#EEF1EA; --papel:#FBFCF9; --tinta:#1E2419; --gris:#6B7266; --linea:#DDE2D6;
  --brasa:#B8442F; --brasa-suave:#F4DED8; --sol:#9A6B12; --sol-suave:#F5EACB; --vacio:#E4E2D9;
  --borde:#CBD2C3; --sol-texto:#5E420B; --brasa-texto:#6B2418; --toast-accion:#BFD7A6; --tinta2:#3E4639; --nivel-texto:#6B4A0C; --aviso-borde:#E0C27A;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --texto:'Figtree',system-ui,sans-serif;
}
:root[data-tema="oscuro"]{--hoja:#9CC77A; --hoja-osc:#86B263; --hoja-suave:#24321C; --kraft:#CDB683; --kraft-osc:#A88E58; --fondo:#121610; --papel:#1C2218; --tinta:#E6EBDF; --gris:#A0A898; --linea:#2B3326; --brasa:#EA8670; --brasa-suave:#3B201A; --sol:#E7B95E; --sol-suave:#362B12; --vacio:#262A23; --borde:#3A4434; --sol-texto:#F0D59A; --brasa-texto:#F5C2B6; --toast-accion:#2C5A12; --tinta2:#C9D1C1; --nivel-texto:#F0D59A; --aviso-borde:#8A6E2E; color-scheme:dark;}
@media (prefers-color-scheme: dark){:root:not([data-tema="claro"]){--hoja:#9CC77A; --hoja-osc:#86B263; --hoja-suave:#24321C; --kraft:#CDB683; --kraft-osc:#A88E58; --fondo:#121610; --papel:#1C2218; --tinta:#E6EBDF; --gris:#A0A898; --linea:#2B3326; --brasa:#EA8670; --brasa-suave:#3B201A; --sol:#E7B95E; --sol-suave:#362B12; --vacio:#262A23; --borde:#3A4434; --sol-texto:#F0D59A; --brasa-texto:#F5C2B6; --toast-accion:#2C5A12; --tinta2:#C9D1C1; --nivel-texto:#F0D59A; --aviso-borde:#8A6E2E; color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--texto);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--hoja);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 16px 96px}
h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;letter-spacing:-.015em;margin:4px 0 14px}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:22px 0 8px}
.sub{color:var(--gris);font-size:13px}
.card{background:var(--papel);border-radius:16px;padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.k{color:var(--gris);font-size:12.5px}
.num{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.row:last-child{border-bottom:0}
.list{background:var(--papel);border-radius:16px;padding:2px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--borde);background:var(--papel);border-radius:999px;padding:7px 13px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--hoja);border-color:var(--hoja);color:var(--papel)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--hoja);color:var(--papel);border-radius:16px;padding:15px;font-weight:600;font-size:16px;width:100%}
.btn:active{background:var(--hoja-osc)}
.btn.sec{background:var(--papel);color:var(--hoja);border:1px solid var(--borde)}
.btn.chico{padding:10px;font-size:14px;border-radius:12px}
.warn{color:var(--sol)} .bad{color:var(--brasa)} .ok{color:var(--hoja)}
.aviso{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;font-size:13.5px}
.aviso.sol{background:var(--sol-suave);color:var(--sol-texto)}
.aviso.brasa{background:var(--brasa-suave);color:var(--brasa-texto)}
.bar{height:8px;background:var(--hoja-suave);border-radius:4px;overflow:hidden}
.bar>div{height:8px;background:var(--hoja);border-radius:4px}
label.campo{display:block;background:var(--papel);border-radius:14px;padding:9px 13px}
label.campo span{display:block;color:var(--gris);font-size:12.5px}
label.campo input,label.campo select{display:block;width:100%;border:0;background:transparent;font-size:16px;padding:2px 0;outline:none}
.paquetes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pk{color:#1E2419;position:relative;overflow:hidden;height:112px;border-radius:14px 14px 6px 6px;background:var(--kraft);text-align:left;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between}
.pk::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:var(--kraft-osc);opacity:.45}
.pk .lleno{position:absolute;left:0;right:0;bottom:0;background:#5E7A3E;opacity:.5;transition:height .4s ease}
.pk>*:not(.lleno){position:relative}
.pk b{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1}
.pk .pie{display:flex;justify-content:space-between;font-size:13px}
.pk.sel{outline:3px solid var(--hoja);outline-offset:2px}
.pk.vacio{background:var(--vacio);color:#8B9086}
.pk.vacio::before{background:#C9C6BA}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--fondo);font-size:20px}
.stepper .n{font-family:var(--display);font-weight:600;font-size:26px;min-width:44px;text-align:center}
.sugs{background:var(--papel);border-radius:14px;margin-top:6px;overflow:hidden}
.sugs button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:11px 13px;border-bottom:1px solid var(--linea)}
.sugs button:last-child{border-bottom:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linea);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--gris);padding:4px 0}
nav.tabs button i{font-size:23px}
nav.tabs button.on{color:var(--hoja);font-weight:600}
nav.tabs button.vender{background:var(--hoja);color:var(--papel);border-radius:16px;margin:0 4px;padding:7px 0;font-weight:600}
nav.tabs button.vender.on{background:var(--hoja-osc)}
.velo{position:fixed;inset:0;background:rgba(30,36,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--fondo);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.hoja h2{margin-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;width:max-content;background:var(--tinta);color:var(--papel);border-radius:14px;padding:11px 16px;font-size:14px;z-index:30;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{color:var(--toast-accion);font-weight:600}
.tachada{color:#9BA095;text-decoration:line-through}
.mensaje{background:var(--fondo);border-radius:12px;padding:9px 11px;font-size:13.5px;color:var(--tinta2);margin:8px 0}
.cargando{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:70vh;color:var(--gris)}
.mate{width:46px;height:46px;border-radius:50% 50% 45% 45%;background:var(--kraft);position:relative;animation:latir 1.2s ease-in-out infinite}
.mate::after{content:"";position:absolute;width:5px;height:30px;background:#9AA19A;border-radius:3px;top:-16px;left:27px;transform:rotate(18deg)}
@keyframes latir{50%{transform:scale(.92)}}
@media (prefers-reduced-motion:reduce){.mate{animation:none}.pk .lleno{transition:none}}
.oculto{display:none!important}
.bloqueo{position:fixed;inset:0;z-index:60;background:var(--fondo);overflow:auto}
.opcion{font-weight:600;margin-bottom:6px}
.opcion+.k{margin:-2px 0 8px}
.marca{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--hoja);margin-bottom:4px}
.marca i{width:18px;height:18px;border-radius:50% 50% 45% 45%;background:var(--kraft);position:relative;display:inline-block}
.marca i::after{content:"";position:absolute;width:2.5px;height:12px;background:#9AA19A;border-radius:2px;top:-7px;left:11px;transform:rotate(18deg)}
.marca.grande{font-size:22px;gap:10px;margin-bottom:6px;letter-spacing:-.01em}
.marca.grande i{width:26px;height:26px}
.marca.grande i::after{width:3px;height:17px;top:-10px;left:16px}
.ini{flex:none;width:38px;height:38px;border-radius:50%;background:var(--hoja-suave);color:var(--hoja);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.nivel{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--sol-suave);color:var(--nivel-texto);white-space:nowrap}
.nivel.vip{background:var(--hoja);color:var(--papel)}
.pk.poco{box-shadow:inset 0 0 0 2px var(--brasa)}
.pk.poco .pie span:last-child{color:#7E2A1A;font-weight:700}
.guardar{position:fixed;left:0;right:0;bottom:var(--alto-nav,68px);z-index:4;padding:10px 16px 8px;background:linear-gradient(transparent,var(--fondo) 35%)}
.guardar .btn{max-width:488px;margin:0 auto;box-shadow:0 6px 18px rgba(30,36,25,.18)}
.reparto{display:flex;height:14px;gap:2px;border-radius:7px;overflow:hidden;margin:10px 0 4px}
.reparto>div{height:100%}
.punto{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.barras{display:flex;align-items:flex-end;gap:10px;height:150px;padding:18px 2px 0;border-bottom:1px solid var(--borde)}
.barras button{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;position:relative}
.barras .b{width:100%;max-width:44px;border-radius:4px 4px 0 0;background:var(--hoja);opacity:.45;transition:opacity .15s}
.barras .b.neg{background:var(--brasa)}
.barras button.on .b{opacity:1}
.barras .v{position:absolute;top:-2px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--tinta)}
.mesesx{display:flex;gap:10px;padding:6px 2px 0}
.mesesx span{flex:1;text-align:center;font-size:12px;color:var(--gris)}
.mesesx span.on{color:var(--tinta);font-weight:600}
.hbar{height:10px;background:var(--hoja-suave);border-radius:0 4px 4px 0;margin-top:5px}
.hbar>div{height:100%;background:var(--hoja);border-radius:0 4px 4px 0}
.mas-ic{width:38px;height:38px;border-radius:12px;background:var(--hoja-suave);color:var(--hoja);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}

/* ---------- pantallas grandes: tablet y compu ---------- */
@media (min-width: 700px){
  .app{max-width:760px}
  nav.tabs .in{max-width:760px}
  .paquetes{grid-template-columns:repeat(4,1fr)}
  .app > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
  .velo{align-items:center;padding:20px}
  .hoja{border-radius:22px;max-height:86vh;max-width:560px;padding-bottom:18px}
}
@media (min-width: 900px){
  .app{max-width:1000px}
  .dos-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .dos-col > .col > h2:first-child{margin-top:0}
  .grid2.cuatro{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dos-col .paquetes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width: 1024px){
  body{padding-left:216px}
  .app{max-width:1080px;padding:28px 36px 48px}
  nav.tabs{top:0;bottom:0;right:auto;width:216px;border-top:0;border-right:1px solid var(--linea);padding:22px 14px}
  nav.tabs .in{display:flex;flex-direction:column;gap:4px;max-width:none;margin:0}
  nav.tabs .in::before{display:none;order:-2;content:"";font-family:var(--display);font-weight:600;font-size:19px;color:var(--hoja);padding:0 10px 18px;letter-spacing:-.01em}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 12px;border-radius:12px}
  nav.tabs button i{font-size:21px}
  nav.tabs button:hover{background:var(--hoja-suave)}
  nav.tabs button.on{background:var(--hoja-suave)}
  nav.tabs button.vender{order:-1;justify-content:center;margin:0 0 14px;padding:12px}
  nav.tabs button.vender:hover{background:var(--hoja-osc)}
  .app > .stack{grid-template-columns:repeat(3,minmax(0,1fr))}
  .guardar{position:sticky;bottom:0 !important;left:auto;right:auto;padding:14px 0 6px;margin-top:8px}
  .guardar .btn{max-width:none}
  .espaciador{display:none}
  .toast{left:calc(50% + 108px);bottom:28px}
  .velo{padding-left:236px}
}

/* ---------- tablero de Inicio y monitores grandes ---------- */
.solo-grande{display:none}
@media (min-width: 900px){
  .solo-grande{display:block}
  .tablero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a b" "a c";column-gap:22px;align-items:start}
  .tablero > .ca{grid-area:a} .tablero > .cb{grid-area:b} .tablero > .cc{grid-area:c}
  .tablero > .cb > h2:first-child{margin-top:0}
}
@media (min-width: 1400px){
  .app{max-width:1560px}
  .tablero{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"a b c";column-gap:26px}
  .tablero > .cc > h2:first-child{margin-top:0}
  .dos-col{gap:30px}
  .app > .stack{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width: 1900px){
  html{zoom:1.15}
}
@media (min-width: 2300px){
  html{zoom:1.3}
}

/* ---------- menú lateral con Más desplegado y bloques con gráficos ---------- */
nav.tabs .subnav{display:none}
nav.tabs .menos{display:none}
@media (min-width: 700px){
  .solo-grande{display:block}
}
@media (min-width: 1024px){
  nav.tabs .subnav{display:none;font-size:14px;padding:8px 12px 8px 24px;color:var(--gris)}
  nav.tabs.abierto .subnav{display:flex}
  nav.tabs .in{align-items:stretch}
  nav.tabs.abierto .in > button[data-v="mas"]:not([data-s]){display:none}
  nav.tabs.abierto .menos{display:flex;font-size:14px;padding:8px 12px 8px 24px;margin-top:4px;color:var(--gris)}
  nav.tabs .menos i{font-size:18px}
  nav.tabs .subnav i{font-size:18px}
  nav.tabs .subnav.on{color:var(--hoja)}
  nav.tabs .in{overflow-y:auto;max-height:100%}
}

/* ---------- marca: en Inicio arriba del saludo; en las demás pantallas, arriba del menú ---------- */
.nav-marca{display:none}
@media (min-width: 1024px){
  .nav-marca{display:flex;padding:0 10px 16px;margin:0;white-space:nowrap;cursor:pointer;border-radius:10px}
  .nav-marca:hover{opacity:.8}
  body.en-inicio .nav-marca{visibility:hidden}
}
.marca-vuela{position:relative;z-index:30;transform-origin:left top}
</style>
</head>
<body>
<div class="app" id="app"><div class="cargando"><div class="mate"></div>Cargando la planilla…</div></div>
<nav class="tabs" id="tabs">
  <div class="marca grande nav-marca" id="navMarca" role="link" tabindex="0" title="Ir al inicio" onclick="ir('inicio')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ir('inicio')}">Coriman Yerbas</div>
  <div class="in">
    <button data-v="inicio"><i class="ti ti-home"></i>Inicio</button>
    <button data-v="ventas"><i class="ti ti-receipt"></i>Ventas</button>
    <button data-v="vender" class="vender"><i class="ti ti-plus"></i>Vender</button>
    <button data-v="clientes"><i class="ti ti-users"></i>Clientes</button>
    <button data-v="mas"><i class="ti ti-dots"></i>Más</button>
    <button data-v="mas" data-s="balance" class="subnav"><i class="ti ti-chart-bar"></i>Balance</button>
    <button data-v="mas" data-s="caja" class="subnav"><i class="ti ti-cash"></i>Caja y retiros</button>
    <button data-v="mas" data-s="lotes" class="subnav"><i class="ti ti-package"></i>Lotes</button>
    <button data-v="mas" data-s="proximo" class="subnav"><i class="ti ti-shopping-cart"></i>Próximo lote</button>
    <button data-v="mas" data-s="gastos" class="subnav"><i class="ti ti-receipt-2"></i>Gastos</button>
    <button data-v="mas" data-s="precios" class="subnav"><i class="ti ti-tag"></i>Precios y stock</button>
    <button data-v="config" class="subnav"><i class="ti ti-settings"></i>Configuración</button>
    <button class="menos" data-nav="cerrar"><i class="ti ti-chevron-up"></i>Menos</button>
  </div>
</nav>
<div id="capa"></div>

<script>
const ENVIVO = typeof google !== 'undefined' && google.script && google.script.run;
/* Preferencias de este celular (Más → Configuración). */
const VERSION = '2026.11.27';
const GUIA_URL = 'https://docs.google.com/document/d/152mhs0PQLR-8Q6UzKP-7ugZpGCis1MEtNQQRyEb5wR0/view';
let PREF = { tema: 'auto', ocultarAlAbrir: true, pinVolver: 0, medio: 'Transferencia' };
try { Object.assign(PREF, JSON.parse(localStorage.getItem('yerba_pref') || '{}')); } catch (e) {}
function guardarPref(){ try { localStorage.setItem('yerba_pref', JSON.stringify(PREF)); } catch (e) {} }
const mqOscuro = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function aplicarTema(){
  const r = document.documentElement;
  if (PREF.tema === 'auto') r.removeAttribute('data-tema'); else r.setAttribute('data-tema', PREF.tema);
  const oscuro = PREF.tema === 'oscuro' || (PREF.tema === 'auto' && mqOscuro && mqOscuro.matches);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) { if (!m.dataset.claro) m.dataset.claro = m.content; m.content = oscuro ? '#121610' : m.dataset.claro; }
}
aplicarTema();
if (mqOscuro && mqOscuro.addEventListener) mqOscuro.addEventListener('change', aplicarTema);
let D = null, vista = 'inicio', sub = null, ocultar = true;
let balMes = null, balVista = 'mes', balLote = null;
let filtroVentas = 'todas', filtroClientes = 'todos', busqueda = '', abierto = null;
let V = nuevaVenta();
try { ocultar = PREF.ocultarAlAbrir ? true : localStorage.getItem('yerba_ocultar') !== '0'; } catch (e) {}

const PROPIO = 'Consumo propio';
const costoDe = p => p ? (Number(p.costo) || Number(p.precio) || 0) : 0;
function nuevaVenta(){ return {otros:[], cliente:'', producto:'', cantidad:1, especial:'', usarEspecial:false, descuento:0, medio:PREF.medio || 'Transferencia', estado:'Pagado', dia:'hoy', fecha:''}; }

/* ------------------------------------------------------------ sin conexión
 * Cada vez que hay internet se guarda una copia de los datos en el celular. Sin señal, la app abre con esa copia
 * y las ventas quedan en una fila de espera (IndexedDB) que se sube sola cuando vuelve la conexión:
 * desde la app abierta, o desde sw.js (sincronización en segundo plano) aunque la app esté cerrada. */
const ERR_RED = 'No se pudo conectar. Revisá internet.';
let SIN_RED = false, PENDIENTES = [], DATOS_DE = null, SUBIENDO = false;
const PUEDE_OFFLINE = !ENVIVO && 'indexedDB' in window;
function hoyLocal(){ const f = new Date(); return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0'); }
function bd(){ return new Promise((ok, mal) => { const r = indexedDB.open('coriman', 1); r.onupgradeneeded = () => { r.result.createObjectStore('cola', { keyPath: 'id' }); r.result.createObjectStore('cfg'); }; r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); }); }
async function bdHacer(store, modo, fn){ const db = await bd(); return new Promise((ok, mal) => { const tx = db.transaction(store, modo); const q = fn(tx.objectStore(store)); tx.oncomplete = () => ok(q ? q.result : undefined); tx.onerror = () => mal(tx.error); }); }
const colaTodas = () => PUEDE_OFFLINE ? bdHacer('cola', 'readonly', st => st.getAll()).catch(() => []) : Promise.resolve([]);
const colaPoner = it => bdHacer('cola', 'readwrite', st => st.put(it));
const colaSacar = id => bdHacer('cola', 'readwrite', st => st.delete(id));
function guardarCfgSW(){ if (PUEDE_OFFLINE && MODO === 'api') bdHacer('cfg', 'readwrite', st => st.put({ api: CFG.api, pin: PIN, sesion: SESION }, 'cred')).catch(() => {}); }
function guardarCopia(){ try { localStorage.setItem('yerba_copia', JSON.stringify({ t: Date.now(), d: D })); } catch (e) {} }
function leerCopia(){ try { const c = JSON.parse(localStorage.getItem('yerba_copia') || 'null'); return c && c.d ? c : null; } catch (e) { return null; } }
function pedirSync(){ if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(r => r.sync ? r.sync.register('subir-ventas') : null).catch(() => {}); }
function idVenta(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
async function aplicarPendientes(){
  PENDIENTES = (await colaTodas()).sort((a, b) => a.t - b.t);
  PENDIENTES.forEach(it => {
    const v = it.venta, pr = prod(v.producto);
    if (pr) pr.stock = (Number(pr.stock) || 0) - Number(v.cantidad);
    D.recientes.unshift({ origen: 'pendiente', fila: 0, idLocal: it.id, pendiente: true, fecha: v.fecha, cliente: v.cliente, producto: v.producto,
      cantidad: v.cantidad, medio: v.medio, estado: v.estado, descuento: v.descuento, precioEspecial: Number(v.precioEspecial) || 0, anulada: false });
  });
}
async function subirPendientes(){
  if (!PUEDE_OFFLINE || SUBIENDO) return 0;
  SUBIENDO = true; let n = 0;
  try {
    for (const it of (await colaTodas()).sort((a, b) => a.t - b.t)) {
      try { await llamar('guardarVenta', it.venta); await colaSacar(it.id); n++; } catch (e) { break; }
    }
  } finally { SUBIENDO = false; }
  return n;
}
function horaTxt(f){ if (!f) return ''; const h = String(f.getHours()).padStart(2, '0') + ':' + String(f.getMinutes()).padStart(2, '0'); const d = f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0'); return (d === hoyLocal() ? 'hoy ' : f.getDate() + '/' + (f.getMonth() + 1) + ' ') + h; }
function avisoRed(){
  if (!SIN_RED && !PENDIENTES.length) return '';
  const n = PENDIENTES.length, ventas = n + (n === 1 ? ' venta sin subir' : ' ventas sin subir');
  return `<div class="aviso ${SIN_RED ? 'sol' : ''}" style="margin-bottom:12px;align-items:center;${SIN_RED ? '' : 'background:var(--hoja-suave)'}"><i class="ti ${SIN_RED ? 'ti-wifi-off' : 'ti-cloud-upload'}" style="font-size:18px"></i>
    <span style="flex:1">${SIN_RED ? 'Sin conexión · datos de ' + horaTxt(DATOS_DE) + '.' + (n ? ' ' + ventas + ': se suben solas cuando vuelva internet.' : ' Podés cargar ventas igual.') : ventas + '.'}</span>
    ${!SIN_RED && n ? '<button class="chip" data-a="subir">Subir ahora</button>' : ''}</div>`;
}
window.addEventListener('online', async () => { const n = await subirPendientes(); if (D) { try { await recargar(); } catch (e) {} } if (n) toast(n === 1 ? 'Se subió la venta pendiente' : 'Se subieron ' + n + ' ventas pendientes'); });
window.addEventListener('offline', () => { SIN_RED = true; if (!DATOS_DE) DATOS_DE = new Date(); if (D) pintar(); });
if ('serviceWorker' in navigator && !ENVIVO && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.tipo === 'subidas') { if (D) recargar().catch(() => {}); toast(e.data.n === 1 ? 'Se subió la venta pendiente' : 'Se subieron ' + e.data.n + ' ventas pendientes'); } });

  if (!TOKEN) return false;
  try { const p = JSON.parse(atob(TOKEN.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.exp * 1000 > Date.now() + 60000; } catch (e) { return false; }
}

      const b = TOKEN.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const p = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))));
      if (p.email) { try { localStorage.setItem('yerba_email', p.email); } catch (e) {} }
      const n = p.given_name || String(p.name || '').split(' ')[0];
      if (n) { try { localStorage.setItem('yerba_nombre', n); } catch (e) {} return n; }

function manejarError(m){

}
function llamar(fn, ...args){
  if (MODO === 'mock') return Mock.llamar(fn, args);
  if (MODO === 'gas') return new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => {
    const m = e && e.message ? e.message : String(e); manejarError(m); mal(m);
  })[fn](PIN, ...args));
  if (CFG.clientId && !SESION && !tokenValido()) { manejarError('AUTH_VENCIDO'); return Promise.reject('AUTH_VENCIDO'); }
  return fetch(CFG.api, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args, pin: PIN, sesion: SESION, token: tokenValido() ? TOKEN : '' }) })
    .then(r => r.json(), () => { throw ERR_RED; })
    .then(j => { if (j.sesion) { SESION = j.sesion; try { localStorage.setItem('yerba_ses', SESION); } catch (e) {} } if (j.ok) return j.data; manejarError(String(j.error)); throw String(j.error); });
}

/* ------------------------------------------------------------ utilidades */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos = n => { const v = Math.round(Number(n) || 0); return (v < 0 ? '−' : '') + '$\u00a0' + Math.abs(v).toLocaleString('es-AR'); };
const numDe = t => { const m = String(t || '').match(/-?\d[\d.]*/); return m ? Number(m[0].replace(/\./g, '')) : 0; };
const unidad = () => D.productos.every(p => !p.peso || Number(p.peso) === 1) ? 'paquetes' : 'kg';
const plata = n => ocultar ? '••••••' : pesos(n);
const cant = n => (Math.round(n * 10) / 10).toLocaleString('es-AR');
const corto = p => String(p).replace(/\s\d+(kg|g)$/i, '');
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function fechaTxt(iso){ if (!iso) return ''; if (iso === D.hoy) return 'hoy'; if (iso === sumarDias(D.hoy, -1)) return 'ayer'; const [y,m,d] = iso.split('-'); return d + '/' + m; }
function sumarDias(iso, n){ const [y,m,d] = iso.split('-').map(Number); const f = new Date(y, m - 1, d + n); return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2,'0') + '-' + String(f.getDate()).padStart(2,'0'); }
function wa(numero, texto){ const n = String(numero).replace(/\D/g,''); return 'https://wa.me/' + n + (texto ? '?text=' + encodeURIComponent(texto) : ''); }
function abrir(url){ window.open(url, '_blank'); }
function prod(nombre){ return D.productos.find(p => p.nombre === nombre); }
function cliente(nombre){ return D.clientes.find(c => norm(c.nombre) === norm(nombre)); }
function nivelDesc(c){ if (!c) return 0; const m = String(c.nivel || '').match(/(\d+)\s*%/); return m ? Number(m[1]) / 100 : 0; }

function volarMarca(el, r0){

  const dx = r0.left - r1.left, dy = r0.top - r1.top, k = 1;
  el.classList.add('marca-vuela');
  const a = el.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${k})` }, { transform: 'translate(0, 0) scale(1)' }],
    { duration: 480, easing: 'cubic-bezier(.22,.8,.24,1)' });

/* ------------------------------------------------------------ cálculos */
function resumenMes(mes){
  const vs = D.ventas.filter(v => mesDe(v.fecha) === mes);
  const total = vs.reduce((s, v) => s + v.total, 0), gan = vs.reduce((s, v) => s + v.ganancia, 0);
  const gastos = D.gastos.filter(g => mesDe(g.fecha) === mes).reduce((s, g) => s + g.monto, 0);
  return { total, gan, gastos, real: gan - gastos, n: vs.length, paq: vs.reduce((s, v) => s + Number(v.cantidad || 0), 0) };
}
function avisoCaja(){
  const d = Math.abs(numDe(D.caja.control));
  if (ocultar) return 'La caja tiene una diferencia: falta anotar algo (una venta, un gasto o un costo).';
  return d ? 'La caja tiene una diferencia de ' + plata(d) + ': falta anotar algo (una venta, un gasto o un costo).' : 'La caja no cuadra: falta anotar algo.';
}
function avisoLote(l){
  const suma = numDe(l.control);
  if (!suma || !l.pagado) return 'Lote ' + l.id + ': ' + l.control + '.';
  const dif = l.pagado - suma;
  if (ocultar) return 'Lote ' + l.id + ': los costos cargados no suman lo que pagaste. Tocá «Ver» para ver cuánto ' + (dif > 0 ? 'falta' : 'sobra') + '.';
  return 'Lote ' + l.id + ': pagaste ' + plata(l.pagado) + ', pero los costos cargados suman ' + plata(suma) + '. ' + (dif > 0 ? 'Faltan ' : 'Sobran ') + plata(Math.abs(dif)) + ' por anotar.';
}
function loteAbierto(){ return D.lotes.find(l => l.estado === 'Abierto'); }
function proyeccion(){
  let ventas = 0, gan = 0;
  D.productos.forEach(p => { if (p.stock > 0 && p.precio > 0) { ventas += p.stock * p.precio; gan += p.stock * (p.precio - p.costo); } });
  return { ventas, gan };
}
function totalReciente(r){
  if (r.precioEspecial > 0) return r.cantidad * r.precioEspecial;
  const m = D.ventas.find(v => v.fecha === r.fecha && norm(v.cliente) === norm(r.cliente) && v.producto === r.producto && v.cantidad === r.cantidad);
  if (m) return m.total;
  const p = prod(r.producto); return p ? r.cantidad * p.precio * (1 - (r.descuento || 0)) : 0;
}

function ojoBtn(){ return `<button class="chip" data-a="ojo" aria-label="${ocultar ? 'Mostrar' : 'Ocultar'} la plata"><i class="ti ${ocultar ? 'ti-eye-off' : 'ti-eye'}"></i> ${ocultar ? 'Ver' : 'Ocultar'}</button>`; }
const cabecera = (t, extra) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1>${t}</h1><div style="display:flex;gap:6px">${ojoBtn()}${extra || ''}</div></div>`;

/* ------------------------------------------------------------ INICIO */
function reservadas(prodNombre){ return D.recientes.filter(r => !r.anulada && r.estado === 'Reservado' && r.producto === prodNombre).reduce((a, r) => a + Number(r.cantidad || 0), 0); }
function vInicio(){
  const h = new Date().getHours();
  const saludo = h < 13 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
  const [y, m, d] = D.hoy.split('-').map(Number);
  const fecha = DIAS[new Date(y, m - 1, d).getDay()] + ' ' + d + ' de ' + MESES[m - 1];
  const mes = resumenMes(D.hoy.slice(0, 7));
  const lote = loteAbierto(); const pr = proyeccion();
  const contactar = D.clientes.filter(c => c.estado === 'CONTACTAR HOY' && c.nombre !== PROPIO);
  const avisos = [];
  const res = D.recientes.filter(r => !r.anulada && r.estado === 'Reservado');
  if (res.length) avisos.push(['sol', 'ti-bookmark', (res.length === 1 ? 'Tenés 1 reserva sin entregar: ' : 'Tenés ' + res.length + ' reservas sin entregar: ') + res.map(r => r.cliente + ' (' + cant(r.cantidad) + ' ' + corto(r.producto) + ')').join(', ') + '. Se entregan desde Ventas → Reservadas.']);
  if (D.caja.control && String(D.caja.control).indexOf('Cuadra') < 0) avisos.push(['sol', 'ti-scale', avisoCaja()]);
  D.lotes.filter(l => l.control && l.control !== 'Completo').forEach(l => avisos.push(['sol', 'ti-package', avisoLote(l)]));
  const pend = D.recientes.filter(r => !r.anulada && r.estado === 'Pendiente').length;
  let html = `
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div><div class="marca grande"><i></i>Coriman Yerbas</div><div class="sub">${fecha.charAt(0).toUpperCase() + fecha.slice(1)}</div><h1>${saludo}${nombreUsuario() ? ', ' + esc(nombreUsuario()) : ''}</h1></div>
    <span style="margin-top:6px;display:flex;gap:6px">${ojoBtn()}<button class="chip" data-a="config" aria-label="Configuración" title="Configuración"><i class="ti ti-settings" style="font-size:17px"></i></button></span>
  </div>
  <div class="tablero"><div class="col ca">
  <div class="grid2">
    <div class="card"><div class="k">En caja</div><div class="num">${plata(D.caja.enCaja)}</div></div>
    <div class="card"><div class="k">Te deben</div><div class="num">${plata(D.caja.teDeben)}</div>${pend ? `<div class="k warn">${pend} ${pend === 1 ? 'venta' : 'ventas'} sin cobrar</div>` : ''}</div>
  </div>
  <div class="card" style="margin-top:8px">
    <div class="k">${MESES[m - 1].charAt(0).toUpperCase() + MESES[m - 1].slice(1)}: ${cant(mes.paq)} ${mes.paq === 1 ? 'paquete vendido' : 'paquetes vendidos'}</div>
    <div class="grid2" style="margin-top:4px">
      <div><div class="num" style="font-size:20px">${plata(mes.total)}</div><div class="k">vendido</div></div>
      <div><div class="num" style="font-size:20px">${plata(mes.real)}</div><div class="k">ganancia real${mes.gastos ? ' (con gastos)' : ''}</div></div>
    </div>
  </div>`;
  const k = D.caja;
  if (k.retiros > 0 || k.reinvertida < 0) {
    const deMas = Math.max(0, -k.reinvertida);
    const faltaLote = Math.max(0, k.proximoLote - (k.enCaja + k.teDeben + pr.ventas));
    html += `<div class="card" style="margin-top:8px;border:1.5px solid ${deMas || faltaLote ? 'var(--aviso-borde)' : 'var(--hoja-suave)'}">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600">Lo que sacaste para vos</span><span class="num" style="font-size:20px">${plata(k.retiros)}</span></div>
      ${ocultar ? `<div class="k" style="margin-top:4px">${deMas ? 'Sacaste más de lo que ganó el negocio. Tocá «Ver» para ver cuánto poner.' : 'Todo salió de la ganancia: el negocio sigue entero.'}</div>` : `
      ${deMas ? `<div style="font-size:14px;margin-top:6px">Sacaste <b>${plata(deMas)}</b> más de lo que ganó el negocio. Para volver a estar en camino, poné <b>${plata(deMas)}</b>.</div>`
        : `<div class="k" style="margin-top:4px">Todo salió de la ganancia: el negocio sigue entero.</div>`}
      <div class="k" style="margin-top:6px">${faltaLote ? 'Aunque vendas todo lo que queda, para el próximo lote te faltarían ' + plata(faltaLote) + '.' : 'Si vendés lo que queda, te alcanza para el próximo lote (' + plata(k.proximoLote) + ').'}</div>`}
      <button class="chip" data-a="irCaja" style="margin-top:8px">Anotar que puse plata</button>
    </div>`;
  }
  avisos.forEach(a => html += `<div class="aviso ${a[0]}" style="margin-top:8px"><i class="ti ${a[1]}" style="font-size:18px"></i><span>${esc(a[2])}</span></div>`);
  html += bloqueReparto();
  html += '</div><div class="col cb">';
  if (lote) {
    const pct = lote.paraVender ? Math.min(1, lote.vendido / lote.paraVender) : 0;
    html += `<h2>Lote ${esc(lote.id)}</h2>
    <div class="card">
      <div style="display:flex;justify-content:space-between" class="k"><span>Vendiste ${cant(lote.vendido)} de ${cant(lote.paraVender)} ${unidad()}</span><span>${Math.round(pct * 100)}%</span></div>
      <div class="bar" style="margin:8px 0 10px"><div style="width:${Math.round(pct * 100)}%"></div></div>
      <div style="font-size:14px">Si vendés lo que queda: <b>${plata(pr.ventas)}</b>, y ganás <b>${plata(pr.gan)}</b>.</div>
      <div class="k" style="margin-top:4px">Para reponer un lote igual necesitás ${plata(D.caja.proximoLote)}. Hoy tenés ${plata(D.caja.enCaja)}${D.caja.teDeben ? ' y, si cobrás lo que te deben, ' + plata(D.caja.enCaja + D.caja.teDeben) : ''}. Podés retirar ${plata(D.caja.podesRetirar)}.</div>
    </div>`;
  }
  html += `<h2>Stock</h2><div class="list">` + D.productos.map(p => `
    <div class="row"><span>${esc(corto(p.nombre))}</span>
    <span class="${p.stock <= 0 ? 'bad' : p.stock <= 5 ? 'warn' : ''}">${p.stock <= 0 ? 'sin stock' : cant(p.stock) + ' paquetes' + (reservadas(p.nombre) ? ' (' + cant(reservadas(p.nombre)) + ' reservada' + (reservadas(p.nombre) === 1 ? '' : 's') + ')' : '') + (p.stock <= 5 ? ', reponer' : '')}</span></div>`).join('') + `</div>`;
  html += bloqueGanancia();
  html += '</div><div class="col cc">';
  if (contactar.length) {
    html += `<h2>Escribirles hoy</h2><div class="list">` + contactar.slice(0, 5).map(c => filaContacto(c)).join('') +
      (contactar.length > 5 ? `<div class="row"><button class="ok" data-a="verContactar" style="font-weight:600">Ver los ${contactar.length}</button><span></span></div>` : '') + `</div>`;
  }
  const ult = D.recientes.filter(r => !r.anulada).slice(0, 6);
  if (ult.length) html += `<h2 class="solo-grande">Últimas ventas</h2><div class="list solo-grande">${ult.map(r => `<button class="row" style="width:100%;text-align:left" data-a="venta" data-i="${D.recientes.indexOf(r)}"><span><span style="font-weight:600">${esc(r.cliente)}</span><div class="k">${cant(r.cantidad)} ${esc(corto(r.producto))}, ${fechaTxt(r.fecha)}</div></span><span style="white-space:nowrap;font-weight:600">${plata(totalReciente(r))}</span></button>`).join('')}<div class="row"><button class="ok" data-a="verVentas" style="font-weight:600">Ver todas las ventas</button><span></span></div></div>`;
  html += '</div></div>';
  return html;
}
function filaContacto(c){
  return `<div class="row"><span>${esc(c.nombre)}<div class="k">${c.ultima ? 'Última compra ' + fechaTxt(c.ultima) : 'Sin compras'}</div></span>
    ${c.wa ? `<button class="chip" data-a="wa" data-c="${esc(c.nombre)}" aria-label="WhatsApp a ${esc(c.nombre)}"><i class="ti ti-brand-whatsapp ok"></i> Escribir</button>` : `<button class="chip" data-a="cli" data-c="${esc(c.nombre)}"><i class="ti ti-plus"></i> Su WhatsApp</button>`}</div>`;
}

/* ------------------------------------------------------------ VENDER */
function textoGuardar(p, total){ const t = V.editando ? 'Guardar cambios' : V.propio ? 'Guardar para mí' : V.estado === 'Reservado' ? 'Guardar reserva' : 'Guardar venta'; return p ? (V.medio === 'Sorteo / regalo' ? (V.editando ? t : 'Guardar regalo') : t + ' · ' + pesos(total)) : t; }
function precioLinea(nombre, cantidad, especial){
  const pp = prod(nombre); if (!pp) return 0;
  const desc = V.medio === 'Sorteo / regalo' ? 1 : V.descuento;
  return (Number(especial) > 0 ? Number(especial) : pp.precio * (1 - desc)) * cantidad;
}
function totalOtros(){ return (V.otros || []).reduce((a, l) => a + precioLinea(l.producto, l.cantidad, l.especial), 0); }
function vVender(){
  V.otros = V.otros || [];
  const c = cliente(V.cliente);
  const max = Math.max(5, ...D.productos.map(p => p.stock));
  const p = prod(V.producto);
  const regalo = V.medio === 'Sorteo / regalo';
  const desc = regalo ? 1 : V.descuento;
  const unit = p ? (V.propio ? costoDe(p) : V.usarEspecial && Number(V.especial) > 0 ? Number(V.especial) : p.precio * (1 - desc)) : 0;
  const total = unit * V.cantidad + totalOtros();
  const sugs = !V.propio && V.cliente && !c ? D.clientes.filter(x => x.nombre !== PROPIO && norm(x.nombre).includes(norm(V.cliente))).slice(0, 6) : [];
  const nd = nivelDesc(c);
  return `${V.editando ? `<div style="display:flex;justify-content:space-between;align-items:center"><h1>Editar venta</h1><button class="chip" data-a="cancelarEdicion"><i class="ti ti-x"></i> Cancelar</button></div>
  <div class="aviso" style="background:var(--hoja-suave);margin-bottom:10px"><i class="ti ti-pencil ok"></i><span>Corregí lo que esté mal y tocá «Guardar cambios». ${V.editando.origen === 'celular' ? 'Como vino del formulario, la original queda anulada y se guarda la corregida.' : 'Se cambia en la misma fila de la planilla.'}</span></div>` : '<h1>Vender</h1>'}
  <div class="dos-col"><div class="col">
  ${V.propio ? `<div class="card" style="display:flex;gap:12px;align-items:center;border:1.5px solid var(--kraft-osc)"><span class="mas-ic" style="background:var(--sol-suave);color:#6B4A0C"><i class="ti ti-user"></i></span><span style="flex:1"><b>Es para vos, a precio de costo</b><div class="k">Sale del stock y no suma ganancia. Así el lote y la caja cierran.</div></span><button class="chip" data-a="propio">Cambiar</button></div>` : `<label class="campo"><span>Cliente</span><input id="inCliente" autocomplete="off" placeholder="Escribí el nombre" value="${esc(V.cliente)}"></label>
  ${V.editando || V.cliente ? '' : `<div class="chips" style="margin-top:6px"><button class="chip" data-a="propio"><i class="ti ti-user"></i> Es para mí (a costo)</button></div>`}`}
  ${c && !V.propio ? `<div class="chips" style="margin-top:6px"><span class="chip">${esc(nivelTxt(c)) || 'Cliente'}</span>${c.compras ? `<span class="chip">${c.compras} ${c.compras === 1 ? 'compra' : 'compras'}</span>` : ''}${nd && !V.usarEspecial ? `<button class="chip ${V.descuento === nd ? 'on' : ''}" data-a="nivelDesc">Aplicar ${Math.round(nd * 100)}%</button>` : ''}</div>` : ''}
  <div id="sugs">${!V.propio && (sugs.length || (V.cliente && !c)) ? `<div class="sugs">${sugs.map(x => `<button data-a="elegirCli" data-c="${esc(x.nombre)}"><span>${esc(x.nombre)}</span><span class="k">${x.compras} compras</span></button>`).join('')}
    ${V.cliente && !c ? `<button data-a="elegirCli" data-c="${esc(V.cliente.trim())}"><span>Cliente nuevo: <b>${esc(V.cliente.trim())}</b></span><i class="ti ti-user-plus ok"></i></button>` : ''}</div>` : ''}</div>
  ${V.otros.length ? `<h2>En esta venta</h2><div class="list">${V.otros.map((l, i) => `<div class="row"><span><b>${cant(l.cantidad)} ${esc(corto(l.producto))}</b>${l.especial ? '<div class="k">precio especial ' + pesos(l.especial) + ' c/u</div>' : ''}</span><span style="display:flex;gap:10px;align-items:center;white-space:nowrap">${pesos(precioLinea(l.producto, l.cantidad, l.especial))}<button class="chip" data-a="quitarOtro" data-i="${i}" aria-label="Quitar ${esc(corto(l.producto))}"><i class="ti ti-x"></i></button></span></div>`).join('')}</div>` : ''}
  <h2>${V.otros.length ? 'Otra yerba (opcional)' : 'Yerba'}</h2>
  <div class="paquetes">${D.productos.map(x => `
    <button class="pk ${x.stock <= 0 ? 'vacio' : x.stock <= 3 ? 'poco' : ''} ${V.producto === x.nombre ? 'sel' : ''}" data-a="prod" data-p="${esc(x.nombre)}" aria-pressed="${V.producto === x.nombre}">
      <div class="lleno" style="height:${x.stock > 0 ? Math.max(8, Math.round(Math.min(1, x.stock / max) * 100)) : 0}%"></div>
      <b>${esc(corto(x.nombre))}</b>
      <div class="pie"><span>${x.precio ? pesos(x.precio) : 'sin precio'}</span><span>${x.stock <= 0 ? 'sin stock' : x.stock <= 3 ? '¡quedan ' + cant(x.stock) + '!' : 'quedan ' + cant(x.stock)}</span></div>
    </button>`).join('')}</div>
  ${p && p.stock <= 0 ? `<div class="aviso sol" style="margin-top:8px"><i class="ti ti-alert-triangle"></i><span>No hay stock cargado de ${esc(corto(p.nombre))}. Si igual la vendiste, guardala y después cargá el lote.</span></div>` : ''}
  <h2>Cantidad</h2>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div class="stepper"><button data-a="menos" aria-label="Menos">−</button><span class="n">${cant(V.cantidad)}</span><button data-a="mas" aria-label="Más">+</button></div>
    <button class="chip ${V.cantidad === .5 ? 'on' : ''}" data-a="medio">Medio paquete</button>
  </div>
  ${!V.editando && !V.propio && p ? `<button class="chip" data-a="otraYerba" style="margin-top:10px"><i class="ti ti-plus"></i> Sumar otra yerba a esta venta</button>` : ''}
  </div><div class="col">
  ${V.propio ? `<h2>Precio</h2><div class="card"><div class="k">Costo por paquete</div><div style="font-weight:600;font-size:17px">${p ? pesos(costoDe(p)) : 'Elegí una yerba'}</div><div class="k" style="margin-top:4px">Es lo que le costó al negocio, según el último lote.</div></div>` : `<h2>Precio</h2>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="k">Precio de lista</div><div style="font-weight:600;font-size:17px">${p ? pesos(p.precio) : 'Elegí una yerba'}</div></div>
      <button class="chip ${V.usarEspecial ? 'on' : ''}" data-a="especial">Precio especial</button>
    </div>
    ${V.usarEspecial ? `<label class="campo" style="background:var(--fondo);margin-top:8px"><span>Cuánto cobraste por paquete</span><input id="inEspecial" inputmode="numeric" placeholder="10000" value="${esc(V.especial)}"></label>` :
      `<div class="chips" style="margin-top:10px">${[0, .05, .1].concat(nd && [0, .05, .1].indexOf(nd) < 0 ? [nd] : []).map(x => `<button class="chip ${!regalo && desc === x ? 'on' : ''}" data-a="desc" data-d="${x}">${x ? Math.round(x * 100) + '% off' : 'Sin descuento'}</button>`).join('')}<button class="chip ${regalo ? 'on' : ''}" data-a="regalo"><i class="ti ti-gift"></i> Regalo</button></div>`}
  </div>`}
  ${V.propio ? `<h2>¿Pusiste la plata en la caja?</h2>
  <div class="chips"><button class="chip ${!V.propioRetiro ? 'on' : ''}" data-a="propioPago" data-r="0">Sí, la puse</button><button class="chip ${V.propioRetiro ? 'on' : ''}" data-a="propioPago" data-r="1">No, la saqué del negocio</button></div>
  <div class="k" style="margin-top:6px">${V.propioRetiro ? 'Se anota también como retiro tuyo, así la caja sigue cuadrando.' : 'Entra a la caja lo que costó, como si te la hubieras vendido.'}</div>` : regalo ? '' : `<h2>¿Cómo pagó?</h2>
  <div class="chips">${['Transferencia','Efectivo','Mercado Pago'].map(m => `<button class="chip ${V.medio === m ? 'on' : ''}" data-a="medio_pago" data-m="${m}">${m}</button>`).join('')}</div>
  <h2>¿Ya te pagó?</h2>
  <div class="chips"><button class="chip ${V.estado === 'Pagado' ? 'on' : ''}" data-a="estado" data-e="Pagado">Sí, ya pagó</button><button class="chip ${V.estado === 'Pendiente' ? 'on' : ''}" data-a="estado" data-e="Pendiente">No, me debe</button><button class="chip ${V.estado === 'Reservado' ? 'on' : ''}" data-a="estado" data-e="Reservado"><i class="ti ti-bookmark"></i> La reservó</button></div>
  ${V.estado === 'Reservado' ? '<div class="k" style="margin-top:6px">Queda apartada para ese cliente: no cuenta como venta hasta que se la entregues. La entregás desde Ventas → Reservadas.</div>' : ''}`}
  <h2>Fecha</h2>
  <div class="chips"><button class="chip ${V.dia === 'hoy' ? 'on' : ''}" data-a="dia" data-d="hoy">Hoy</button><button class="chip ${V.dia === 'ayer' ? 'on' : ''}" data-a="dia" data-d="ayer">Ayer</button><button class="chip ${V.dia === 'otra' ? 'on' : ''}" data-a="dia" data-d="otra">Otra fecha</button></div>
  ${V.dia === 'otra' ? `<label class="campo" style="margin-top:8px"><span>Día de la venta</span><input id="inFecha" type="date" value="${esc(V.fecha || D.hoy)}" max="${D.hoy}"></label>` : ''}
  </div></div>
  <div class="espaciador" style="height:84px"></div>
  <div class="guardar"><button class="btn" data-a="guardarVenta" id="btGuardar">${textoGuardar(p || (V.otros.length ? true : null), total)}</button></div>`;
}

/* ------------------------------------------------------------ VENTAS */
function vVentas(){
  const mes = D.hoy.slice(0, 7), r = resumenMes(mes);
  let lista = D.recientes.slice();
  if (filtroVentas === 'cobrar') lista = lista.filter(x => !x.anulada && x.estado === 'Pendiente');
  else if (filtroVentas === 'reservadas') lista = lista.filter(x => !x.anulada && x.estado === 'Reservado');
  else if (filtroVentas === 'anuladas') lista = lista.filter(x => x.anulada);
  else lista = lista.filter(x => !x.anulada || filtroVentas === 'todas');
  return `${cabecera('Ventas')}
  <div class="grid2"><div class="card"><div class="k">${MESES[Number(mes.slice(5)) - 1].charAt(0).toUpperCase() + MESES[Number(mes.slice(5)) - 1].slice(1)}</div><div class="num">${plata(r.total)}</div></div>
  <div class="card"><div class="k">Ganancia</div><div class="num">${plata(r.gan)}</div></div></div>
  <div class="chips" style="margin:12px 0 8px">${[['todas','Todas'],['cobrar','A cobrar'],['reservadas','Reservadas'],['anuladas','Anuladas']].map(f => `<button class="chip ${filtroVentas === f[0] ? 'on' : ''}" data-a="filtroV" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>
  <div class="list">${lista.length ? lista.map((x, i) => `
    <button class="row" style="width:100%;text-align:left" data-a="venta" data-i="${D.recientes.indexOf(x)}">
      <span class="${x.anulada ? 'tachada' : ''}"><span style="font-weight:600">${esc(x.cliente)}</span>
        <div class="k">${cant(x.cantidad)} ${esc(corto(x.producto))}, ${fechaTxt(x.fecha)}${x.precioEspecial ? ', precio especial' : ''}</div></span>
      <span style="text-align:right;white-space:nowrap" class="${x.anulada ? 'tachada' : ''}">${plata(totalReciente(x))}${x.estado === 'Pendiente' && !x.anulada ? '<div class="k warn">debe</div>' : ''}${x.estado === 'Reservado' && !x.anulada ? '<div class="k warn">reservada</div>' : ''}${x.anulada ? '<div class="k">anulada</div>' : ''}${x.pendiente ? '<div class="k warn"><i class="ti ti-cloud-off"></i> sin subir</div>' : ''}</span>
    </button>`).join('') : `<div class="row"><span class="sub">${filtroVentas === 'cobrar' ? 'Nadie te debe plata.' : filtroVentas === 'anuladas' ? 'No hay ventas anuladas.' : filtroVentas === 'reservadas' ? 'No hay yerba reservada.' : 'Todavía no hay ventas.'}</span></div>`}</div>
  <div class="k" style="margin-top:8px">Tocá una venta para anularla o marcarla como cobrada.</div>`;
}
function editarVenta(x){
  V = nuevaVenta();
  const esp = Number(x.precioEspecial) > 0;
  Object.assign(V, { cliente: x.cliente, producto: x.producto, cantidad: Number(x.cantidad) || 1,
    descuento: esp ? 0 : (Number(x.descuento) >= 1 ? 0 : Number(x.descuento) || 0),
    medio: Number(x.descuento) >= 1 ? 'Sorteo / regalo' : (x.medio || 'Transferencia'), estado: x.estado || 'Pagado',
    especial: esp ? String(x.precioEspecial) : '', usarEspecial: esp,
    dia: x.fecha === D.hoy ? 'hoy' : x.fecha === sumarDias(D.hoy, -1) ? 'ayer' : 'otra', fecha: x.fecha,
    editando: { origen: x.origen, fila: x.fila, cliente: x.cliente } });
  ir('vender');
}
function hojaVenta(i){

let PL = (() => { try { return JSON.parse(localStorage.getItem('yerba_plan')) || {}; } catch (e) { return {}; } })();
function planCalc(){
  const k = D.caja, def = (Number(k.enCaja) || 0) + (Number(k.teDeben) || 0);
  const pres = Number(PL.pres) > 0 ? Number(PL.pres) : def;
  const meta = Number(PL.paq) > 0 ? Number(PL.paq) : Infinity;
  const vend = {}; D.ventas.forEach(v => { vend[v.producto] = (vend[v.producto] || 0) + Number(v.cantidad || 0); });
  const filas = D.productos.map(p => {
    const cc = (PL.costo || {})[p.nombre], ff = (PL.fijo || {})[p.nombre];
    const c = Number(cc) > 0 ? Number(cc) : Number(p.costo) || 0;
    const fijo = ff !== undefined && ff !== '' ? Number(ff) : null;
    return { p, c, fijo, w: (vend[p.nombre] || 0) + 1, q: fijo !== null ? fijo : 0 };
  });
  // Reparte de a un paquete: siempre a la yerba que más se vende en proporción a lo que ya lleva, mientras alcance la plata.
  for (let i = 0; i < 500; i++) {
    const resto = pres - filas.reduce((a, f) => a + f.q * f.c, 0);
    if (filas.reduce((a, f) => a + f.q, 0) >= meta) break;
    let mejor = null;
    filas.forEach(f => { if (f.fijo === null && f.c > 0 && f.c <= resto) { const sc = (f.q + 1) / f.w; if (!mejor || sc < mejor.sc) mejor = { f, sc }; } });
    if (!mejor) break;
    mejor.f.q++;
  }
  const suma = fn => filas.reduce((a, f) => a + fn(f), 0);
  return { def, pres, meta, filas, paq: suma(f => f.q), total: suma(f => f.q * f.c), kg: suma(f => f.q * (f.p.peso || 1)), gan: suma(f => f.q * ((f.p.precio || 0) - f.c)) };
}

    const suma = conCosto.reduce((s, it) => s + Number(it.paquetes) * (it.producto === '__nueva' ? (it.nPres === '500g' ? .5 : 1) : ((prod(it.producto) || {}).peso || 1)) * Number(it.costoKg), 0);
    const dif = Math.round(total - suma);
    $('#lCheck').innerHTML = dif === 0 ? `<div class="aviso" style="background:var(--hoja-suave)"><i class="ti ti-check ok"></i><span>Los costos suman lo que pagaste.</span></div>`
      : `<div class="aviso sol"><i class="ti ti-alert-triangle"></i><span>Los costos suman ${pesos(suma)}: ${dif > 0 ? 'faltan' : 'sobran'} ${pesos(Math.abs(dif))}.</span></div>`;
  };
  hoja(`<h2>Lote nuevo</h2><div class="stack">
    <div class="grid2"><label class="campo"><span>Fecha</span><input id="lFecha" type="date" value="${D.hoy}"></label>
    <label class="campo"><span>Proveedor</span><input id="lProv" placeholder="Distribuidora"></label></div>
    <label class="campo"><span>Lo que pagaste por todo</span><input id="lTotal" inputmode="numeric" placeholder="145000"></label>
    <div class="k">Cargá solo lo que compraste ahora: lo que sobró del lote anterior se suma solo. El costo por kg es opcional, solo si cada yerba tuvo su precio.</div>
    <div id="lItems" class="stack"></div>
    <button class="chip" id="lMas" style="align-self:flex-start"><i class="ti ti-plus"></i> Agregar otra yerba</button>
    <div id="lCheck"></div>
    <button class="btn" id="lOk">Guardar lote</button><button class="btn sec" onclick="cerrarHoja()">Cancelar</button></div>`, () => {
    pintarItems();
    $('#lTotal').oninput = chequeo;
    $('#lMas').onclick = () => { items.push({ producto: D.productos[Math.min(items.length, D.productos.length - 1)].nombre, paquetes: '', costoKg: '' }); pintarItems(); };
    $('#lOk').onclick = async () => {
      const total = Number($('#lTotal').value.replace(/\D/g, ''));
      const sinNombre = items.some(it => it.producto === '__nueva' && Number(it.paquetes) > 0 && !String(it.nNombre || '').trim());
      if (sinNombre) return toast('Escribí el nombre de la yerba nueva');
      const its = items.filter(it => Number(it.paquetes) > 0).map(it => {
        const base = { producto: it.producto, paquetes: Number(String(it.paquetes).replace(',', '.')), costoKg: Number(String(it.costoKg).replace(/\D/g, '')) || '' };
        if (it.producto !== '__nueva') return base;
        const pres = it.nPres === '500g' ? '500g' : '1kg';
        let nom = String(it.nNombre).trim().replace(/\s+/g, ' ');
        nom = nom.charAt(0).toUpperCase() + nom.slice(1);
        if (!/\b(1\s?kg|500\s?g)$/i.test(nom)) nom += ' ' + pres;
        const ya = D.productos.find(p => norm(p.nombre) === norm(nom));
        if (ya) { base.producto = ya.nombre; return base; }
        base.producto = nom; base.nueva = { presentacion: pres, precio: Number(String(it.nPrecio || '').replace(/\D/g, '')) || '' };
        return base;
      });
      if (!total) return toast('Poné lo que pagaste por el lote');
      if (!its.length) return toast('Agregá cuántos paquetes trajo');
      $('#lOk').disabled = true;
      try { const r = await llamar('nuevoLote', { fecha: $('#lFecha').value, proveedor: $('#lProv').value, total, items: its }); cerrarHoja(); toast('Lote ' + r.id + ' guardado' + (r.nuevos && r.nuevos.length ? '. Yerba nueva: ' + r.nuevos.join(', ') : '') + (r.control && r.control !== 'Completo' ? '. Revisá los costos' : '')); await recargar(); }
      catch (e) { $('#lOk').disabled = false; error(e); }
    };
  });
}
function vGastos(){
  const mes = D.hoy.slice(0, 7);
  const delMes = D.gastos.filter(g => mesDe(g.fecha) === mes).reduce((s, g) => s + g.monto, 0);
  return `${volver()}${cabecera('Gastos', '<button class="chip on" data-a="nuevoGasto"><i class="ti ti-plus"></i> Anotar</button>')}
  <div class="card"><div class="k">Este mes</div><div class="num">${plata(delMes)}</div><div class="k">Se restan de la ganancia real del mes.</div></div>
  <h2>Últimos</h2><div class="list">${D.gastos.slice().reverse().slice(0, 25).map(g => `<div class="row"><span>${esc(g.concepto)}<div class="k">${fechaTxt(g.fecha)}${g.detalle ? ', ' + esc(g.detalle) : ''}</div></span><span style="font-weight:600">${plata(g.monto)}</span></div>`).join('') || '<div class="row"><span class="sub">Todavía no anotaste gastos.</span></div>'}</div>`;
}
function hojaGasto(){
  const conceptos = ['Nafta / envíos','Bolsas / packaging','Publicidad','Comisión Mercado Pago','Regalos y promociones','Otros'];
  let conc = conceptos[0];
  hoja(`<h2>Anotar un gasto</h2><div class="stack">
    <div class="chips" id="gC">${conceptos.map(c => `<button class="chip ${c === conc ? 'on' : ''}" data-c="${c}">${c}</button>`).join('')}</div>
    <label class="campo"><span>Monto</span><input id="gMonto" inputmode="numeric" placeholder="3500"></label>
    <label class="campo"><span>Fecha</span><input id="gFecha" type="date" value="${D.hoy}" max="${D.hoy}"></label>
    <label class="campo"><span>Detalle (opcional)</span><input id="gDet" placeholder="Viaje a la distribuidora"></label>
    <button class="btn" id="gOk">Guardar gasto</button><button class="btn sec" onclick="cerrarHoja()">Cancelar</button></div>`, () => {
    $('#gC').querySelectorAll('button').forEach(b => b.onclick = () => { conc = b.dataset.c; $('#gC').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
    $('#gOk').onclick = async () => {
      const monto = Number($('#gMonto').value.replace(/\D/g, ''));
      if (!monto) return toast('Poné el monto');
      $('#gOk').disabled = true;
      try { await llamar('agregarGasto', { concepto: conc, monto, fecha: $('#gFecha').value, detalle: $('#gDet').value }); cerrarHoja(); toast('Gasto guardado'); await recargar(); }
      catch (e) { $('#gOk').disabled = false; error(e); }
    };
  });
}
function vPrecios(){
  return `${volver()}<h1>Precios y stock</h1><div class="stack">${D.productos.map(p => {
    const marg = p.costo ? (p.precio - p.costo) / p.costo : 0;
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-weight:600;font-size:16px">${esc(p.nombre)}</div><div class="k">Te cuesta ${p.costo ? pesos(p.costo) : 'sin costo'}${p.costo && p.precio ? ', ganás ' + Math.round(marg * 100) + '%' : ''}${p.sugerido ? ', sugerido ' + pesos(p.sugerido) : ''}</div></div>
      <button class="chip" data-a="precio" data-p="${esc(p.nombre)}">${p.precio ? pesos(p.precio) : 'Poner precio'}</button></div>
      <div class="k" style="margin-top:6px" class="${p.stock <= 0 ? 'bad' : p.stock <= 5 ? 'warn' : ''}">Stock: ${p.stock <= 0 ? 'sin stock' : cant(p.stock) + ' paquetes'}</div></div>`; }).join('')}</div>
  <div class="k" style="margin-top:10px">Al cambiar un precio, el anterior queda guardado: las ventas viejas no cambian.</div>`;
}
function hojaPrecio(nombre){
  const p = prod(nombre);
  hoja(`<h2>${esc(nombre)}</h2><div class="stack">
    <label class="campo"><span>Precio de venta nuevo</span><input id="pPrecio" inputmode="numeric" value="${p.precio || ''}"></label>
    ${p.sugerido ? `<div class="k">Para ganar el ${Math.round(p.gananciaDeseada * 100)}% que querés, el sugerido es ${pesos(p.sugerido)}.</div>` : ''}
    <button class="btn" id="pOk">Guardar precio</button><button class="btn sec" onclick="cerrarHoja()">Cancelar</button></div>`, () => {
    $('#pOk').onclick = async () => {
      const precio = Number($('#pPrecio').value.replace(/\D/g, ''));
      if (!precio) return toast('Poné un precio');
      if (p.precio && (precio > p.precio * 3 || precio < p.precio / 3) && !confirm('El precio nuevo es muy distinto al de antes (' + pesos(p.precio) + '). ¿Es correcto ' + pesos(precio) + '?')) return;
      $('#pOk').disabled = true;
      try { await llamar('cambiarPrecio', nombre, precio); cerrarHoja(); toast('Precio guardado'); await recargar(); }
      catch (e) { $('#pOk').disabled = false; error(e); }
    };
  });
}

/* ------------------------------------------------------------ eventos */
function enlazar(){
  const app = $('#app');
  app.querySelectorAll('[data-a]').forEach(el => el.onclick = () => accion(el.dataset.a, el));
  const ic = $('#inCliente');
  if (ic) ic.oninput = () => { V.cliente = ic.value; const pos = ic.selectionStart; pintar(); const n = $('#inCliente'); n.focus(); n.setSelectionRange(pos, pos); };
  const ie = $('#inEspecial');
  if (ie) ie.oninput = () => { V.especial = ie.value.replace(/\D/g, ''); const bt = $('#btGuardar'); const p = prod(V.producto); if (bt && p) bt.textContent = textoGuardar(p, (Number(V.especial) || p.precio) * V.cantidad + totalOtros()); };
  const ifch = $('#inFecha'); if (ifch) ifch.onchange = () => V.fecha = ifch.value;
  app.querySelectorAll('[data-pl]').forEach(el => el.oninput = () => {
    const v = el.value.replace(/\D/g, ''), t = el.dataset.pl;
    if (t === 'costo' || t === 'fijo') { PL[t] = PL[t] || {}; if (v === '') delete PL[t][el.dataset.n]; else PL[t][el.dataset.n] = v; } else PL[t] = v;
    try { localStorage.setItem('yerba_plan', JSON.stringify(PL)); } catch (e) {}
    planPintarRes();
  });
  planPintarRes();
  const ib = $('#inBuscar');
  if (ib) ib.oninput = () => { busqueda = ib.value; const pos = ib.selectionStart; pintar(); const n = $('#inBuscar'); n.focus(); n.setSelectionRange(pos, pos); };
}
async function accion(a, el){
  const d = el.dataset;
  switch (a) {
    case 'ojo': ocultar = !ocultar; try { localStorage.setItem('yerba_ocultar', ocultar ? '1' : '0'); } catch (e) {} return pintar();
    case 'wa': { const c = cliente(d.c); return c && c.wa ? abrir(wa(c.wa, c.mensaje)) : hojaCliente(c); }
    case 'cli': case 'editCli': return hojaCliente(cliente(d.c));
    case 'verVentas': return ir('ventas');
    case 'cambiarPin': return hojaCambiarPin();
    case 'irBalance': return ir('mas', 'balance');
    case 'verContactar': filtroClientes = 'hoy'; return ir('clientes');
    case 'elegirCli': V.cliente = d.c; return pintar();
    case 'nivelDesc': V.descuento = V.descuento === nivelDesc(cliente(V.cliente)) ? 0 : nivelDesc(cliente(V.cliente)); return pintar();
    case 'prod': V.producto = d.p; return pintar();
    case 'otraYerba':
      if (V.usarEspecial && !(Number(V.especial) > 0)) return toast('Poné el precio especial o sacalo');
      V.otros.push({ producto: V.producto, cantidad: V.cantidad, especial: V.usarEspecial ? Number(V.especial) : '' });
      V.producto = ''; V.cantidad = 1; V.usarEspecial = false; V.especial = '';
      pintar(); toast('Agregada. Elegí la otra yerba'); return;
    case 'quitarOtro': V.otros.splice(Number(d.i), 1); return pintar();
    case 'menos': V.cantidad = V.cantidad <= 1 ? .5 : V.cantidad - 1; return pintar();
    case 'mas': V.cantidad = V.cantidad === .5 ? 1 : V.cantidad + 1; return pintar();
    case 'medio': V.cantidad = .5; return pintar();
    case 'especial': V.usarEspecial = !V.usarEspecial; if (V.usarEspecial) { V.descuento = 0; if (V.medio === 'Sorteo / regalo') V.medio = 'Transferencia'; } pintar(); if (V.usarEspecial) setTimeout(() => $('#inEspecial') && $('#inEspecial').focus(), 50); return;
    case 'desc': V.descuento = Number(d.d); if (V.medio === 'Sorteo / regalo') V.medio = 'Transferencia'; return pintar();
    case 'regalo': if (V.medio === 'Sorteo / regalo') { V.medio = 'Transferencia'; } else { V.medio = 'Sorteo / regalo'; V.estado = 'Pagado'; V.usarEspecial = false; } return pintar();
    case 'medio_pago': V.medio = d.m; return pintar();
    case 'estado': V.estado = d.e; return pintar();
    case 'propio': if (V.propio) { V.propio = false; V.cliente = ''; } else { V.propio = true; V.propioRetiro = false; V.cliente = PROPIO; V.usarEspecial = false; V.descuento = 0; V.estado = 'Pagado'; if (V.medio === 'Sorteo / regalo') V.medio = PREF.medio || 'Transferencia'; } return pintar();
    case 'propioPago': V.propioRetiro = d.r === '1'; return pintar();
    case 'dia': V.dia = d.d; return pintar();
    case 'guardarVenta': return guardarVenta(el);
    case 'cancelarEdicion': V = nuevaVenta(); return ir('ventas');
    case 'filtroV': filtroVentas = d.f; return pintar();
    case 'venta': return hojaVenta(Number(d.i));
    case 'filtroC': filtroClientes = d.f; return pintar();
    case 'abrirCli': abierto = d.c; return pintar();
    case 'nuevoCli': return hojaCliente(null);
    case 'venderA': V = nuevaVenta(); V.cliente = d.c; return ir('vender');
    case 'pref': { let v = d.v; if (v === 'true' || v === 'false') v = v === 'true'; else if (/^\d+$/.test(v)) v = Number(v);
      PREF[d.k] = v; guardarPref(); if (d.k === 'tema') aplicarTema(); if (d.k === 'pinVolver' && v) marcarSalida(); return pintar(); }
    case 'guia': return abrir(GUIA_URL);
    case 'config': return ir('config');
    case 'irInicio': return ir('inicio');
    case 'balMes': balMes = d.m; return pintar();
    case 'balLote': balLote = d.l; return pintar();
    case 'balVista': balVista = d.v; return pintar();
    case 'sub': sub = d.s || null; window.scrollTo(0, 0); return pintar();
    case 'planLimpiar': PL = {}; try { localStorage.removeItem('yerba_plan'); } catch (e) {} return pintar();
    case 'mov': return hojaMov(d.t);
    case 'irCaja': return hojaMov('Aporte');
    case 'salir': if (!confirm('¿Cerrar sesión en este celular? Vas a tener que entrar con Google y poner el PIN de nuevo.')) return;
      if (MODO === 'api' && SESION) llamar('cerrarSesion').catch(() => {});
      olvidarSesion(); olvidarPin(); TOKEN = ''; try { localStorage.removeItem('yerba_copia'); localStorage.removeItem('yerba_email'); } catch (e) {} if (PUEDE_OFFLINE) bdHacer('cfg', 'readwrite', st => st.delete('cred')).catch(() => {}); try { sessionStorage.removeItem('yerba_tok'); localStorage.removeItem('yerba_nombre'); } catch (e) {}
      try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch (e) {}
      return arrancar();
    case 'nuevoLote': return hojaLote();
    case 'nuevoGasto': return hojaGasto();
    case 'precio': return hojaPrecio(d.p);
    case 'recargar': el.disabled = true; try { await recargar(); } catch (e) { return error(e); } return toast(SIN_RED ? 'Sin conexión: se muestran los últimos datos' : 'Datos actualizados');
    case 'subir': { el.disabled = true; const n = await subirPendientes(); await recargar(); return toast(n ? (n === 1 ? 'Se subió la venta pendiente' : 'Se subieron ' + n + ' ventas') : 'No se pudo subir todavía'); }
  }
}
async function guardarVenta(bt){
  V.otros = V.otros || [];
  if (!V.cliente.trim()) return toast('Elegí o escribí el cliente');
  if (!V.producto && V.otros.length === 1) { const l = V.otros.pop(); V.producto = l.producto; V.cantidad = l.cantidad; if (l.especial) { V.usarEspecial = true; V.especial = String(l.especial); } }
  if (!V.producto && !V.otros.length) return toast('Elegí la yerba');
  if (V.otros.length && !V.editando && !V.propio) return guardarVarias(bt);
  if (V.usarEspecial && !(Number(V.especial) > 0)) return toast('Poné el precio especial o sacalo');
  const hoy = SIN_RED ? hoyLocal() : D.hoy;
  const fecha = V.dia === 'hoy' ? hoy : V.dia === 'ayer' ? sumarDias(hoy, -1) : (V.fecha || hoy);
  const venta = { fecha, cliente: V.cliente.trim(), producto: V.producto, cantidad: V.cantidad,
    descuento: V.medio === 'Sorteo / regalo' ? 1 : V.descuento, medio: V.medio, estado: V.estado,
    precioEspecial: V.usarEspecial ? Number(V.especial) : '', idLocal: idVenta() };
  if (V.propio) {
    const pp = prod(V.producto), costo = costoDe(pp);
    if (!costo) return toast('Esa yerba no tiene costo cargado todavía');
    Object.assign(venta, { cliente: PROPIO, descuento: 0, estado: 'Pagado', precioEspecial: costo });
    if (SIN_RED || !navigator.onLine) return toast('Para anotar algo para vos necesitás internet');
    bt.disabled = true; bt.textContent = 'Guardando…';
    try {
      const r = await llamar('guardarVenta', venta);
      if (V.propioRetiro) await llamar('movimientoCaja', { tipo: 'Retiro', monto: costo * V.cantidad, fecha, detalle: 'Yerba para consumo propio: ' + cant(V.cantidad) + ' ' + corto(V.producto) });
      V = nuevaVenta(); await recargar(); window.scrollTo(0, 0);
      toast('Anotado para vos, a costo', async () => { await llamar('anularVenta', 'compu', r.fila, true); await recargar(); toast('Anulado. Si anotaste un retiro, borralo en Caja.'); });
    } catch (e) { bt.disabled = false; pintar(); error(e); }
    return;
  }
  bt.disabled = true; bt.textContent = 'Guardando…';
  if (!V.editando && PUEDE_OFFLINE && MODO !== 'gas' && (SIN_RED || !navigator.onLine)) return guardarSinRed(venta);
  if (V.editando) {
    try {
      await llamar('editarVenta', V.editando.origen, V.editando.fila, venta);
      V = nuevaVenta(); await recargar(); ir('ventas'); toast('Venta corregida');
    } catch (e) { bt.disabled = false; pintar(); error(e); }
    return;
  }
  try {
    const r = await llamar('guardarVenta', venta);
    const quien = venta.cliente, era = !cliente(quien);
    V = nuevaVenta(); await recargar(); window.scrollTo(0, 0);
    toast((venta.estado === 'Reservado' ? 'Reserva para ' : 'Venta a ') + quien + ' guardada' + (era ? '. Cliente nuevo agregado' : ''), async () => { await llamar('anularVenta', 'compu', r.fila, true); await recargar(); toast('Venta anulada'); });
  } catch (e) {
    if (e === ERR_RED && PUEDE_OFFLINE && MODO !== 'gas') return guardarSinRed(venta);
    bt.disabled = false; pintar(); error(e);
  }
}
async function guardarVarias(bt){
  if (V.producto && V.usarEspecial && !(Number(V.especial) > 0)) return toast('Poné el precio especial o sacalo');
  const hoy = SIN_RED ? hoyLocal() : D.hoy;
  const fecha = V.dia === 'hoy' ? hoy : V.dia === 'ayer' ? sumarDias(hoy, -1) : (V.fecha || hoy);
  const lineas = V.otros.concat(V.producto ? [{ producto: V.producto, cantidad: V.cantidad, especial: V.usarEspecial ? Number(V.especial) : '' }] : []);
  const ventas = lineas.map(l => ({ fecha, cliente: V.cliente.trim(), producto: l.producto, cantidad: l.cantidad,
    descuento: V.medio === 'Sorteo / regalo' ? 1 : V.descuento, medio: V.medio, estado: V.estado, precioEspecial: l.especial || '', idLocal: idVenta() }));
  const quien = V.cliente.trim(), era = !cliente(quien), n = ventas.length;
  bt.disabled = true; bt.textContent = 'Guardando…';
  const sinRed = async (resto) => {
    for (const v of resto) await colaPoner({ id: v.idLocal, t: Date.now(), venta: v });
    guardarCfgSW(); pedirSync();
    V = nuevaVenta(); await recargar(); window.scrollTo(0, 0);
    toast('Sin señal: la venta quedó guardada en el celular y se sube sola cuando vuelva internet.');
  };
  if (PUEDE_OFFLINE && MODO !== 'gas' && (SIN_RED || !navigator.onLine)) return sinRed(ventas);
  const filas = [];
  try {
    for (const v of ventas) { const r = await llamar('guardarVenta', v); filas.push(r.fila); }
  } catch (e) {
    if (e === ERR_RED && PUEDE_OFFLINE && MODO !== 'gas') return sinRed(ventas.slice(filas.length));
    bt.disabled = false; await recargar(); return toast(filas.length ? 'Se guardaron ' + filas.length + ' de ' + n + ' yerbas. Revisá en Ventas y cargá la que falta.' : 'No se pudo guardar. Revisá la conexión y probá de nuevo.');
  }
  V = nuevaVenta(); await recargar(); window.scrollTo(0, 0);
  toast((ventas[0].estado === 'Reservado' ? 'Reserva para ' : 'Venta a ') + quien + ' guardada (' + n + ' yerbas)' + (era ? '. Cliente nuevo agregado' : ''),
    async () => { for (const f of filas) await llamar('anularVenta', 'compu', f, true); await recargar(); toast('Venta anulada'); });
}
async function guardarSinRed(venta){
  try { await colaPoner({ id: venta.idLocal, t: Date.now(), venta }); }
  catch (e) { pintar(); return toast('No se pudo guardar en el celular. Probá de nuevo.'); }
  guardarCfgSW(); pedirSync();
  V = nuevaVenta(); await recargar(); window.scrollTo(0, 0);
  toast('Sin señal: la venta quedó guardada en el celular y se sube sola cuando vuelva internet.');
}
